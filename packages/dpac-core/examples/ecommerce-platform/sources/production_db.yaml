# Source: Production PostgreSQL Database
# Contains transactional data from the e-commerce application

name: production_db
type: database
entities:
  - name: users
    description: Customer accounts and profile information
    entityType: table
    
  - name: orders
    description: Order transactions
    entityType: table
    
  - name: order_items
    description: Individual items within orders
    entityType: table
    
  - name: products
    description: Product catalog
    entityType: table
    
  - name: categories
    description: Product categories
    entityType: table

metadata:
  description: Primary production PostgreSQL database
  owner: data-engineering-team
