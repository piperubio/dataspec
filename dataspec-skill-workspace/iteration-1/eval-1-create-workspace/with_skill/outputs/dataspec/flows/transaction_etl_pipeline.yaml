# Flow: Transaction ETL Pipeline
# Extract transactions from PostgreSQL, load to raw, transform to refined

name: transaction_etl_pipeline
steps:
  # Extract from PostgreSQL source
  - type: extract
    source: postgresql_db
    entity: transactions
    output: raw_transactions

  # Load to raw layer in S3
  - type: load
    input: raw_transactions
    target: transactions_raw

  # Transform with dbt for refined layer
  - type: transform
    inputs:
      - raw_transactions
    engine: dbt-transforms
    output: refined_transactions

  # Load to refined layer in S3 (Delta format)
  - type: load
    input: refined_transactions
    target: transactions_refined

metadata:
  description: ETL pipeline for payment transactions - from PostgreSQL to S3 data lake
  version: '1.0.0'
  labels:
    - etl
    - transactions
    - payments
    - core
