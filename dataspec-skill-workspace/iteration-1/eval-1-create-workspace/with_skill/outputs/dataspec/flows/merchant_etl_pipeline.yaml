# Flow: Merchant ETL Pipeline
# Extract merchants from PostgreSQL, load to raw, transform to refined

name: merchant_etl_pipeline
steps:
  # Extract from PostgreSQL source
  - type: extract
    source: postgresql_db
    entity: merchants
    output: raw_merchants

  # Load to raw layer in S3
  - type: load
    input: raw_merchants
    target: merchants_raw

  # Transform with dbt for refined layer
  - type: transform
    inputs:
      - raw_merchants
    engine: dbt-transforms
    output: refined_merchants

  # Load to refined layer in S3 (Delta format)
  - type: load
    input: refined_merchants
    target: merchants_refined

metadata:
  description: ETL pipeline for merchant data - from PostgreSQL to S3 data lake
  version: '1.0.0'
  labels:
    - etl
    - merchants
    - business
    - core
