# Dataset: Transactions Raw
# Raw ingestion of transaction data from PostgreSQL

name: transactions_raw
storage:
  backend: s3-data-lake
  format: parquet
  location: s3://fintech-data-lake/raw/transactions/

contract:
  name: transactions_raw_schema
  version: '1.0.0'

metadata:
  description: Raw transaction data ingested from PostgreSQL production database
  owner: data-engineering-team
  tags:
    - raw
    - transactions
    - payments
    - financial
  refresh_frequency: hourly
  retention_days: 90
