# Contract: Transaction Contract
# Refined schema for payment transactions after transformation

name: transaction_contract
version: '1.0.0'
fields:
  - name: transaction_id
    type: uuid
    constraints:
      unique: true
      not_null: true
    description: Unique identifier for the transaction

  - name: merchant_id
    type: uuid
    constraints:
      not_null: true
      ref: 'merchant_contract.merchant_id'
    description: Foreign key to merchant

  - name: amount_cents
    type: integer
    constraints:
      not_null: true
      min: 1
    description: Transaction amount in cents (normalized)

  - name: currency
    type: string
    constraints:
      not_null: true
    description: ISO 4217 currency code

  - name: status
    type: string
    constraints:
      not_null: true
      allowed_values:
        - pending
        - processing
        - completed
        - failed
        - refunded
        - chargeback
    description: Transaction status

  - name: payment_method
    type: string
    constraints:
      not_null: true
    description: Payment method category

  - name: card_brand
    type: string
    description: Card brand if card payment

  - name: is_card_present
    type: boolean
    description: Whether card was physically present

  - name: created_at
    type: timestamp
    constraints:
      not_null: true
    description: Transaction creation timestamp

  - name: completed_at
    type: timestamp
    description: Transaction completion timestamp

  - name: processing_time_ms
    type: integer
    description: Time taken to process transaction in milliseconds

  - name: is_test_mode
    type: boolean
    description: Whether transaction was in test mode

  - name: fraud_score
    type: decimal
    constraints:
      min: 0
      max: 100
    description: Fraud detection score (0-100)

  - name: metadata
    type: json
    description: Enriched transaction metadata

metadata:
  description: Refined schema for payment transactions with normalized amounts
  owner: data-platform-team
  pii: true
  tags:
    - transactions
    - refined
    - financial
