# Contract: Transactions Raw Schema
# Raw schema for payment transactions from PostgreSQL

name: transactions_raw_schema
version: '1.0.0'
fields:
  - name: transaction_id
    type: uuid
    constraints:
      unique: true
      not_null: true
    description: Unique identifier for the transaction

  - name: merchant_id
    type: uuid
    constraints:
      not_null: true
      ref: 'merchants_raw_schema.merchant_id'
    description: Foreign key to merchant

  - name: amount
    type: decimal
    constraints:
      not_null: true
      precision: 18
      scale: 2
      min: 0.01
    description: Transaction amount in currency units

  - name: currency
    type: string
    constraints:
      not_null: true
    description: ISO 4217 currency code

  - name: status
    type: string
    constraints:
      not_null: true
      allowed_values:
        - pending
        - processing
        - completed
        - failed
        - refunded
    description: Transaction status

  - name: payment_method
    type: string
    constraints:
      not_null: true
    description: Payment method used (card, bank_transfer, wallet, etc.)

  - name: created_at
    type: timestamp
    constraints:
      not_null: true
    description: Timestamp when transaction was created

  - name: updated_at
    type: timestamp
    description: Timestamp when transaction was last updated

  - name: card_last_four
    type: string
    description: Last 4 digits of card used (if card payment)

  - name: card_brand
    type: string
    description: Card brand (Visa, Mastercard, etc.)

  - name: customer_email
    type: string
    description: Customer email address

  - name: customer_id
    type: uuid
    description: Customer identifier if available

  - name: reference_id
    type: string
    description: External reference ID from payment gateway

  - name: metadata
    type: json
    description: Additional transaction metadata

metadata:
  description: Raw schema for payment transactions - contains financial data
  owner: payments-team
  pii: true
  tags:
    - transactions
    - payments
    - financial
