# Contract: Payout Contract
# Refined schema for payout data after transformation

name: payout_contract
version: '1.0.0'
fields:
  - name: payout_id
    type: uuid
    constraints:
      unique: true
      not_null: true
    description: Unique identifier for the payout

  - name: merchant_id
    type: uuid
    constraints:
      not_null: true
      ref: 'merchant_contract.merchant_id'
    description: Foreign key to merchant

  - name: amount_cents
    type: integer
    constraints:
      not_null: true
      min: 1
    description: Payout amount in cents (normalized)

  - name: currency
    type: string
    constraints:
      not_null: true
    description: ISO 4217 currency code

  - name: status
    type: string
    constraints:
      not_null: true
      allowed_values:
        - pending
        - processing
        - completed
        - failed
        - cancelled
    description: Payout status

  - name: payment_method
    type: string
    constraints:
      not_null: true
    description: Payout method type

  - name: created_at
    type: timestamp
    constraints:
      not_null: true
    description: Payout request timestamp

  - name: processed_at
    type: timestamp
    description: Payout processing timestamp

  - name: completed_at
    type: timestamp
    description: Payout completion timestamp

  - name: processing_time_hours
    type: decimal
    constraints:
      min: 0
    description: Time from request to completion in hours

  - name: fee_amount_cents
    type: integer
    constraints:
      min: 0
    description: Processing fee in cents

  - name: net_amount_cents
    type: integer
    constraints:
      not_null: true
      min: 0
    description: Net amount after fees in cents

  - name: failure_category
    type: string
    allowed_values:
      - insufficient_funds
      - invalid_account
      - bank_rejection
      - compliance
      - timeout
      - other
    description: Category of failure if failed

  - name: retry_count
    type: integer
    description: Number of retry attempts

  - name: metadata
    type: json
    description: Enriched payout metadata

metadata:
  description: Refined schema for payout data with normalized amounts
  owner: data-platform-team
  pii: false
  tags:
    - payouts
    - refined
    - settlement
