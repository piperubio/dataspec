# Contract: Payment Analytics Contract
# Analytics schema for payment processing dashboard

name: payment_analytics_contract
version: '1.0.0'
fields:
  - name: date
    type: date
    constraints:
      not_null: true
    description: Date for daily aggregation

  - name: merchant_id
    type: uuid
    constraints:
      not_null: true
    description: Merchant identifier

  - name: merchant_name
    type: string
    description: Merchant business name

  - name: total_transactions
    type: integer
    constraints:
      not_null: true
      min: 0
    description: Total number of transactions

  - name: successful_transactions
    type: integer
    constraints:
      not_null: true
      min: 0
    description: Number of successful transactions

  - name: failed_transactions
    type: integer
    constraints:
      not_null: true
      min: 0
    description: Number of failed transactions

  - name: total_amount_usd
    type: decimal
    constraints:
      not_null: true
      precision: 20
      scale: 2
      min: 0
    description: Total transaction amount in USD

  - name: average_amount_usd
    type: decimal
    constraints:
      not_null: true
      precision: 18
      scale: 2
      min: 0
    description: Average transaction amount in USD

  - name: success_rate
    type: decimal
    constraints:
      not_null: true
      min: 0
      max: 100
    description: Transaction success rate percentage

  - name: refund_count
    type: integer
    description: Number of refunds

  - name: refund_amount_usd
    type: decimal
    constraints:
      precision: 18
      scale: 2
      min: 0
    description: Total refund amount in USD

  - name: chargeback_count
    type: integer
    description: Number of chargebacks

  - name: chargeback_rate
    type: decimal
    constraints:
      min: 0
      max: 100
    description: Chargeback rate percentage

metadata:
  description: Aggregated daily payment analytics by merchant
  owner: analytics-team
  pii: false
  tags:
    - analytics
    - payments
    - dashboard
