# Source: Inventory Updates Kafka Stream
# Real-time inventory change events from Kafka cluster

name: inventory_updates_kafka
type: streaming
protocol: kafka
baseUrl: kafka.internal:9092
entities:
  - name: inventory_updates
    location: inventory-updates
    contract:
      name: inventory_updates_stream_schema
      version: '1.0.0'
    description: Real-time inventory change events (restocks and sales)
    metadata:
      partitions: 6
      replication_factor: 3
      retention_ms: 604800000

metadata:
  description: Kafka streaming source for inventory update events
  owner: streaming-team
  tags:
    - streaming
    - kafka
    - real-time
    - inventory
    - internal
