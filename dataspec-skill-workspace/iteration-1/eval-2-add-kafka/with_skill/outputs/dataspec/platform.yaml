# Minimal E-commerce Data Platform

platform:
  name: ecommerce-platform
  version: '1.0.0'
  description: 'E-commerce data platform with inventory streaming'
  owner: data-platform-team

storage:
  - name: s3-data-lake
    type: s3
    connection: 's3://data-lake-bucket/'
    options:
      region: us-east-1
      encryption: AES256

engines:
  - name: dbt-transforms
    type: dbt
    version: '>=1.5.0'

defaults:
  storage: s3-data-lake
  engine: dbt-transforms
