# Contract: Inventory Updates Stream Schema
# Schema for Kafka inventory updates topic

name: inventory_updates_stream_schema
version: '1.0.0'
fields:
  - name: inventory_id
    type: uuid
    constraints:
      not_null: true
    description: Unique identifier for the inventory record

  - name: product_id
    type: uuid
    constraints:
      not_null: true
    description: Product identifier

  - name: warehouse_id
    type: string
    description: Warehouse identifier where inventory is stored

  - name: quantity_changed
    type: integer
    constraints:
      not_null: true
    description: Amount of quantity change (positive or negative)

  - name: change_type
    type: string
    constraints:
      not_null: true
      allowed_values:
        - restock
        - sale
    description: Type of inventory change

  - name: event_timestamp
    type: timestamp
    constraints:
      not_null: true
    description: Timestamp when the inventory change occurred

metadata:
  description: Schema for Kafka inventory-updates topic
  owner: streaming-team
  layer: raw
  tags:
    - raw
    - source-schema
    - streaming
    - kafka
    - inventory
