name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Check tag matches CLI version
        run: |
          version=$(bun -e "console.log(require('./packages/dataspec-cli/package.json').version)")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/dataspec-cli version v${version}"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

      - name: Run oxlint
        run: bun run lint

      - name: Check formatting
        run: bun run fmt:check

      - name: Run tests
        run: bun test

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: bun-linux-x64, name: dataspec-linux-amd64, exe: dataspec, archive: tar.gz }
          - { target: bun-linux-arm64, name: dataspec-linux-arm64, exe: dataspec, archive: tar.gz }
          - { target: bun-darwin-x64, name: dataspec-darwin-amd64, exe: dataspec, archive: tar.gz }
          - {
              target: bun-darwin-arm64,
              name: dataspec-darwin-arm64,
              exe: dataspec,
              archive: tar.gz,
            }
          - {
              target: bun-windows-x64,
              name: dataspec-windows-amd64,
              exe: dataspec.exe,
              archive: zip,
            }
          - {
              target: bun-windows-arm64,
              name: dataspec-windows-arm64,
              exe: dataspec.exe,
              archive: zip,
            }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        working-directory: packages/dataspec-cli
        run: bun scripts/build.ts --target=${{ matrix.target }} --outfile ./dist/${{ matrix.exe }}

      - name: Package binary
        working-directory: packages/dataspec-cli/dist
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip ${{ matrix.name }}.zip ${{ matrix.exe }}
          else
            tar -czf ${{ matrix.name }}.tar.gz ${{ matrix.exe }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: packages/dataspec-cli/dist/${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
