name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      
      - name: Install dependencies
        run: bun install
      
      - name: Build packages
        run: |
          cd packages/dpac-core && bun run build
          cd ../dpac-cli && bun run build
      
      - name: Run tests
        run: |
          cd packages/dpac-core && bun test
          cd ../dpac-cli && bun test
      
      - name: Run linting
        run: bun run lint || true

  validate-cli:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Build packages
        run: |
          cd packages/dpac-core && bun run build
          cd ../dpac-cli && bun run build
      
      - name: Test CLI against example workspace
        run: |
          cd packages/dpac-cli
          bun run build
          ./bin/dpac validate --path examples/ecommerce-platform || true
      
      - name: Test CLI commands
        run: |
          cd packages/dpac-cli
          ./bin/dpac --version
          ./bin/dpac --help
          ./bin/dpac list --help
          ./bin/dpac validate --help
