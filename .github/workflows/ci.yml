name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      
      - name: Install and build dataspec-core
        run: |
          cd packages/dataspec-core
          bun install
          bun run build
      
      - name: Install and build dataspec-cli
        run: |
          cd packages/dataspec-cli
          bun install
          bun run build
      
      - name: Run tests
        run: |
          cd packages/dataspec-core && bun test
          cd ../dataspec-cli && bun test
      
      - name: Run linting
        run: |
          cd packages/dataspec-core && bun run lint || true
          cd ../dataspec-cli && bun run lint || true

  validate-cli:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install and build dataspec-core
        run: |
          cd packages/dataspec-core
          bun install
          bun run build
      
      - name: Install and build dataspec-cli
        run: |
          cd packages/dataspec-cli
          bun install
          bun run build
      
      - name: Test CLI against example workspace
        run: |
          cd packages/dataspec-cli
          bun run build
          set +e
          ./bin/dataspec validate --path ../../examples/ecommerce-platform
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "CLI validate command failed with unexpected exit code: $status"
            exit "$status"
          fi
      
      - name: Test CLI commands
        run: |
          cd packages/dataspec-cli
          ./bin/dataspec --version
          ./bin/dataspec --help
          ./bin/dataspec list --help
          ./bin/dataspec validate --help
