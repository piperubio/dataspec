name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run typecheck
        run: bun run typecheck

      - name: Run oxlint
        run: bun run lint

      - name: Check formatting
        run: bun run fmt:check

      - name: Build CLI binary
        run: bun run build

      - name: Run tests
        run: bun test

  validate-cli:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build CLI binary
        run: bun run build

      - name: Test CLI against example workspace
        run: |
          set +e
          ./packages/dataspec-cli/bin/dataspec validate --path examples/ecommerce-platform
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "CLI validate command failed with unexpected exit code: $status"
            exit "$status"
          fi

      - name: Test CLI commands
        run: |
          ./packages/dataspec-cli/bin/dataspec --version
          ./packages/dataspec-cli/bin/dataspec --help
          ./packages/dataspec-cli/bin/dataspec list --help
          ./packages/dataspec-cli/bin/dataspec validate --help
