# Flow: Marketing ELT Pipeline
# Extract-Load-Transform pattern: Load raw first, then transform to refined
# This pattern allows data scientists to access raw data and enables reprocessing

name: marketing_elt_pipeline
steps:
  # ELT Pattern Step 1: EXTRACT from external S3 bucket
  - type: extract
    source: external_s3_bucket
    entity: marketing_csv_exports
    output: s3_csv_files

  # ELT Pattern Step 2: LOAD directly to raw layer (no transformation yet)
  # This preserves the original data exactly as received for debugging and reprocessing
  - type: load
    input: s3_csv_files
    target: marketing_campaigns_raw

  # ELT Pattern Step 3: TRANSFORM from raw to refined
  # All business logic, validation, and cleaning happens here
  - type: transform
    inputs:
      - marketing_campaigns_raw
    engine: dbt-transforms
    output: marketing_campaigns_refined

  # Step 4: LOAD to refined layer with contract enforcement
  - type: load
    input: marketing_campaigns_refined
    target: marketing_campaigns_refined_dataset

metadata:
  description: |
    ELT (Extract-Load-Transform) pipeline for marketing data.
    
    Benefits of ELT over ETL:
    - Raw data is preserved exactly as received from source
    - Data scientists can query raw data for exploratory analysis
    - Failed transformations don't block data availability
    - Easy to reprocess raw data with new transformation logic
    - Schema changes in source are visible in raw layer first
    
    Pattern:
    1. EXTRACT: Pull CSV files from external S3 bucket
    2. LOAD: Store as-is in raw layer (bronze) - no validation yet
    3. TRANSFORM: Apply business rules, validation, cleaning
    4. LOAD: Save to refined layer (silver) with contract enforcement
  owner: marketing-team
  schedule: "0 3 * * *"
  tags:
    - elt
    - extract-load-transform
    - marketing
    - s3
    - csv
    - external-source
    - daily
    - raw-preservation
    - dbt
