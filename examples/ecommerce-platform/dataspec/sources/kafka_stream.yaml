# Source: Kafka Event Stream
# Real-time event streaming platform for operational and analytics events

name: kafka_events
type: streaming
protocol: kafka
baseUrl: kafka.example.com:9092
entities:
  - name: user_events
    location: user-events
    contract:
      name: user_events_stream_schema
      version: "1.0.0"
    description: Real-time user activity events (clicks, views, actions)
    metadata:
      partitions: 12
      replication_factor: 3
      retention_ms: 604800000

  - name: order_events
    location: order-events
    contract:
      name: order_events_stream_schema
      version: "1.0.0"
    description: Order lifecycle events (created, updated, completed, cancelled)
    metadata:
      partitions: 24
      replication_factor: 3
      retention_ms: 1209600000

  - name: payment_events
    location: payment-events
    contract:
      name: payment_events_stream_schema
      version: "1.0.0"
    description: Payment processing events (initiated, completed, failed, refunded)
    metadata:
      partitions: 12
      replication_factor: 3
      retention_ms: 2592000000

  - name: inventory_events
    location: inventory-events
    contract:
      name: inventory_events_stream_schema
      version: "1.0.0"
    description: Inventory level changes and stock updates
    metadata:
      partitions: 6
      replication_factor: 3
      retention_ms: 604800000

  - name: notification_events
    location: notification-events
    contract:
      name: notification_events_stream_schema
      version: "1.0.0"
    description: Email, push, and SMS notification delivery events
    metadata:
      partitions: 6
      replication_factor: 3
      retention_ms: 259200000

  - name: analytics_events
    location: analytics-events
    contract:
      name: events_raw_schema
      version: "1.0.0"
    description: Aggregated analytics events for real-time dashboards
    metadata:
      partitions: 24
      replication_factor: 3
      retention_ms: 86400000

metadata:
  description: Kafka event streaming platform for real-time data processing
  owner: streaming-team
  tags:
    - streaming
    - kafka
    - real-time
    - events
    - pub-sub
  cluster_type: production