# Source: External APIs
# Third-party integrations for shipping, marketing, and other services

name: external_apis
type: api
protocol: https
baseUrl: api.example.com
entities:
  # Shipping Provider API
  - name: shipments
    location: /api/v1/shipments/{tracking_number}
    method: GET
    contract:
      name: shipments_raw_schema
      version: "1.0.0"
    description: Shipment tracking and status updates
    metadata:
      provider: fedex-ups-dhl
      rate_limit: 5000

  - name: shipping_rates
    location: /api/v1/shipping/rates
    method: POST
    contract:
      name: shipping_rates_raw_schema
      version: "1.0.0"
    description: Real-time shipping rate calculations
    metadata:
      cache_duration: 1800

  - name: delivery_estimates
    location: /api/v1/delivery/estimates
    method: GET
    contract:
      name: delivery_estimates_raw_schema
      version: "1.0.0"
    description: Estimated delivery dates
    metadata:
      cache_duration: 3600

  # Marketing Platform API
  - name: campaigns
    location: /api/v1/marketing/campaigns
    method: GET
    contract:
      name: marketing_campaigns_raw_schema
      version: "1.0.0"
    description: Marketing campaign metadata
    metadata:
      provider: hubspot/marketo
      rate_limit: 1000

  - name: email_metrics
    location: /api/v1/marketing/email/metrics
    method: GET
    contract:
      name: email_metrics_raw_schema
      version: "1.0.0"
    description: Email campaign performance metrics
    metadata:
      rate_limit: 500

  - name: ad_spend
    location: /api/v1/marketing/ads/spend
    method: GET
    contract:
      name: ad_spend_raw_schema
      version: "1.0.0"
    description: Advertising spend by platform and campaign
    metadata:
      provider: google-ads-meta
      rate_limit: 300

  # Customer Support API
  - name: support_tickets
    location: /api/v1/support/tickets
    method: GET
    contract:
      name: support_tickets_raw_schema
      version: "1.0.0"
    description: Customer support ticket data
    metadata:
      provider: zendesk
      rate_limit: 700

  - name: customer_satisfaction
    location: /api/v1/support/satisfaction
    method: GET
    contract:
      name: customer_satisfaction_raw_schema
      version: "1.0.0"
    description: CSAT and NPS survey responses
    metadata:
      rate_limit: 200

metadata:
  description: External third-party API integrations for shipping, marketing, and support
  owner: integrations-team
  tags:
    - external
    - integrations
    - shipping
    - marketing
    - support