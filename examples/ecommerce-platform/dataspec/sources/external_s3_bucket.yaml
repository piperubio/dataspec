# Source: External S3 Data Lake
# Object storage bucket containing exported data, logs, and third-party datasets
# This is an external S3 bucket (not our internal storage) that serves as a data source

name: external_s3_bucket
type: file_system
entities:
  - name: marketing_csv_exports
    location: s3://external-data-bucket/marketing/campaigns/*.csv
    format: csv
    contract:
      name: marketing_campaigns_raw_schema
      version: "1.0.0"
    description: Marketing campaign data exported as CSV files

  - name: application_logs
    location: s3://external-data-bucket/logs/application/*.json
    format: json
    contract:
      name: application_logs_raw_schema
      version: "1.0.0"
    description: Application log files in JSON format

  - name: legacy_data_exports
    location: s3://external-data-bucket/legacy/exports/*.parquet
    format: parquet
    contract:
      name: legacy_exports_raw_schema
      version: "1.0.0"
    description: Historical data exports from legacy system

  - name: third_party_datasets
    location: s3://external-data-bucket/external/datasets/*.parquet
    format: parquet
    contract:
      name: third_party_datasets_raw_schema
      version: "1.0.0"
    description: Third-party datasets and enrichments

  - name: clickstream_s3
    location: s3://external-data-bucket/clickstream/year=*/month=*/day=*/*.json.gz
    format: json
    contract:
      name: clickstream_raw_schema
      version: "1.0.0"
    partition_by:
      - year
      - month
      - day
    description: Real-time clickstream data streamed to S3
    metadata:
      compression: gzip

  - name: product_feeds
    location: s3://external-data-bucket/product-feeds/*.avro
    format: avro
    contract:
      name: product_feeds_raw_schema
      version: "1.0.0"
    description: External product catalog feeds from suppliers

metadata:
  description: External S3 bucket serving as file-based data source for batch ingestion
  owner: data-engineering-team
  tags:
    - external
    - s3
    - object-storage
    - file-system
    - batch
  refresh_frequency: hourly
  notes: |
    This S3 bucket is owned by the Data Platform team but acts as a landing zone
    for various external data sources. Files are organized by source system and date.

    Access patterns:
    - marketing_csv_exports: Updated daily at 2 AM UTC
    - application_logs: Real-time streaming via Kinesis Firehose
    - legacy_data_exports: One-time migration, static
    - third_party_datasets: Updated weekly on Mondays
    - clickstream_s3: Real-time, partitioned by date