# Source: External Payment API
# REST API for payment processing data

name: payment_api
type: api
protocol: https
baseUrl: api.payment-provider.com/v1
entities:
  - name: transactions
    location: /transactions/{transaction_id}
    method: GET
    contract:
      name: payments_raw_schema
      version: "1.0.0"
    description: Payment transactions endpoint - returns all payment transactions
    metadata:
      rate_limit: 1000
      pagination: cursor

  - name: refunds
    location: /refunds/{refund_id}
    method: GET
    contract:
      name: refunds_raw_schema
      version: "1.0.0"
    description: Refund transactions endpoint - returns processed refunds
    metadata:
      rate_limit: 500
      pagination: offset

  - name: payment_methods
    location: /payment-methods
    method: GET
    contract:
      name: payment_methods_schema
      version: "1.0.0"
    description: Available payment methods and configurations
    metadata:
      cache_duration: 3600

  - name: chargebacks
    location: /chargebacks
    method: GET
    contract:
      name: chargebacks_raw_schema
      version: "1.0.0"
    description: Chargeback and dispute records
    metadata:
      rate_limit: 100
      pagination: cursor

  - name: settlements
    location: /settlements
    method: GET
    contract:
      name: settlements_raw_schema
      version: "1.0.0"
    description: Daily settlement batches
    metadata:
      rate_limit: 200

metadata:
  description: External payment processor API - Stripe/PayPal integration
  owner: payments-team
  auth_type: oauth2
  tags:
    - external
    - payments
    - financial
    - pii