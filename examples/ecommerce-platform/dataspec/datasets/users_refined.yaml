# Dataset: Refined Users
# Cleaned and validated user data

name: users_refined
storage:
  backend: s3-data-lake
  format: delta
  location: s3://data-lake/refined/users/

contract:
  name: user_contract
  version: '1.0.0'

metadata:
  description: Cleaned and validated user data with deduplication and PII handling
  owner: data-platform-team
  tags:
    - refined
    - users
    - pii
    - silver-layer
  refresh_frequency: hourly
  quality_checks:
    - unique_user_id
    - valid_email_format
    - no_duplicate_emails
