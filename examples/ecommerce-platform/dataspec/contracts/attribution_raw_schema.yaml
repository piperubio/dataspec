# Contract: Attribution Raw Schema
# Defines the expected schema from the analytics attribution table

name: attribution_raw_schema
version: '1.0.0'
fields:
  - name: id
    type: uuid
    constraints:
      not_null: true
    description: Primary key

  - name: user_id
    type: uuid
    constraints:
      not_null: true
    description: User ID

  - name: campaign_id
    type: string
    description: Campaign ID

  - name: channel
    type: string
    constraints:
      not_null: true
    description: Marketing channel

  - name: source
    type: string
    description: Traffic source

  - name: medium
    type: string
    description: Traffic medium

  - name: attributed_at
    type: timestamp
    constraints:
      not_null: true
    description: Attribution timestamp

metadata:
  description: Source schema for marketing attribution data from analytics database
  owner: analytics-team
  layer: raw
  source: analytics_db
  tags:
    - raw
    - source-schema
    - attribution
