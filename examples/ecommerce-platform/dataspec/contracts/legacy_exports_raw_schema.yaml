# Contract: Legacy Exports Raw Schema
# Defines the expected schema from legacy system exports in S3

name: legacy_exports_raw_schema
version: '1.0.0'
fields:
  - name: export_id
    type: string
    constraints:
      not_null: true
    description: Export record identifier

  - name: export_type
    type: string
    constraints:
      not_null: true
    description: Type of exported data

  - name: data
    type: json
    constraints:
      not_null: true
    description: Exported data payload

  - name: exported_at
    type: timestamp
    constraints:
      not_null: true
    description: Export timestamp

  - name: source_system
    type: string
    description: Source system name

metadata:
  description: Source schema for legacy data exports from external S3 bucket
  owner: data-engineering-team
  layer: raw
  source: external_s3_bucket
  tags:
    - raw
    - source-schema
    - legacy
