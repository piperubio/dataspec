# Contract: Refunds Raw Schema
# Defines the expected schema from payment refunds API

name: refunds_raw_schema
version: '1.0.0'
fields:
  - name: refund_id
    type: string
    constraints:
      not_null: true
    description: Refund identifier

  - name: transaction_id
    type: string
    constraints:
      not_null: true
    description: Original transaction ID

  - name: amount
    type: decimal
    constraints:
      not_null: true
    description: Refund amount

  - name: currency
    type: string
    constraints:
      not_null: true
    description: Refund currency

  - name: status
    type: string
    constraints:
      not_null: true
    description: Refund status

  - name: reason
    type: string
    description: Refund reason

  - name: created_at
    type: timestamp
    constraints:
      not_null: true
    description: Refund creation timestamp

metadata:
  description: Source schema for refunds from payment API
  owner: payments-team
  layer: raw
  source: payment_api
  tags:
    - raw
    - source-schema
    - payments
