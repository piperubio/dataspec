# Contract: User Delete Schema
# Defines the expected request/response schema for gRPC DeleteUser endpoint

name: user_delete_schema
version: '1.0.0'
fields:
  - name: id
    type: uuid
    constraints:
      not_null: true
    description: User identifier to delete

  - name: deleted_at
    type: timestamp
    description: Deletion timestamp (for soft delete)

  - name: reason
    type: string
    description: Deletion reason

  - name: deleted_by
    type: uuid
    description: ID of user performing deletion

metadata:
  description: Schema for gRPC user service DeleteUser endpoint (soft delete)
  owner: user-platform-team
  layer: raw
  source: grpc_user_service
  tags:
    - raw
    - source-schema
    - grpc
    - users
