# Contract: Application Logs Raw Schema
# Defines the expected schema from application logs in S3

name: application_logs_raw_schema
version: '1.0.0'
fields:
  - name: log_id
    type: string
    constraints:
      not_null: true
    description: Log entry identifier

  - name: timestamp
    type: timestamp
    constraints:
      not_null: true
    description: Log timestamp

  - name: level
    type: string
    constraints:
      not_null: true
    description: Log level (info, warn, error, etc.)

  - name: service
    type: string
    constraints:
      not_null: true
    description: Service name that generated log

  - name: message
    type: string
    constraints:
      not_null: true
    description: Log message

  - name: metadata
    type: json
    description: Additional log metadata

  - name: trace_id
    type: string
    description: Distributed tracing ID

metadata:
  description: Source schema for application logs from external S3 bucket
  owner: data-engineering-team
  layer: raw
  source: external_s3_bucket
  tags:
    - raw
    - source-schema
    - logs
