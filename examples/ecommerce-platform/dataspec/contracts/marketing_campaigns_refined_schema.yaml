# Contract: Marketing Campaigns Refined Schema
# Cleaned and validated marketing campaign data

name: marketing_campaigns_refined_schema
version: '1.0.0'
fields:
  - name: campaign_id
    type: string
    constraints:
      not_null: true
      unique: true
    description: Marketing campaign identifier

  - name: campaign_name
    type: string
    description: Human-readable campaign name

  - name: channel
    type: string
    constraints:
      not_null: true
    description: Marketing channel (email, social, paid_search, etc.)

  - name: start_date
    type: date
    constraints:
      not_null: true
    description: Campaign start date

  - name: end_date
    type: date
    description: Campaign end date

  - name: budget
    type: decimal
    constraints:
      not_null: true
    description: Campaign budget in USD

  - name: spend
    type: decimal
    description: Actual spend

  - name: impressions
    type: integer
    description: Total impressions

  - name: clicks
    type: integer
    description: Total clicks

  - name: conversions
    type: integer
    description: Total conversions

  - name: revenue_attributed
    type: decimal
    description: Revenue attributed to campaign

  - name: target_audience
    type: string
    description: Target audience segment

  - name: created_at
    type: timestamp
    constraints:
      not_null: true
    description: Record creation timestamp

  - name: processed_at
    type: timestamp
    description: Data processing timestamp

metadata:
  description: Cleaned and validated marketing campaign data with deduplication and business rules
  owner: marketing-team
  layer: refined
  tags:
    - refined
    - marketing
    - campaigns
    - silver-layer
    - etl