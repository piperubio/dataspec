# Contract: Order Items Raw Schema
# Defines the expected schema from the production order_items table

name: order_items_raw_schema
version: "1.0.0"
fields:
  - name: item_id
    type: uuid
    constraints:
      not_null: true
    description: Line item primary key
    
  - name: order_id
    type: uuid
    constraints:
      not_null: true
    description: Reference to orders.order_id
    
  - name: product_id
    type: uuid
    constraints:
      not_null: true
    description: Reference to products.product_id
    
  - name: quantity
    type: integer
    constraints:
      not_null: true
    description: Quantity ordered
    
  - name: unit_price
    type: decimal
    constraints:
      not_null: true
    description: Price per unit at time of order
    
  - name: total_price
    type: decimal
    constraints:
      not_null: true
    description: quantity * unit_price
    
  - name: discount_amount
    type: decimal
    description: Line item discount
    
  - name: tax_amount
    type: decimal
    description: Line item tax
    
  - name: created_at
    type: timestamp
    constraints:
      not_null: true
    description: When item was added to order

metadata:
  description: Source schema for order_items table from production database
  owner: data-engineering-team
  layer: raw
  source: production_db
  pii: false
  tags:
    - raw
    - source-schema
    - order-items
    - financial
    - production
