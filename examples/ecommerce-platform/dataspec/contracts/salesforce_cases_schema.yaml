# Contract: Salesforce Cases Schema
# Defines the expected schema from Salesforce Case objects

name: salesforce_cases_schema
version: '1.0.0'
fields:
  - name: case_id
    type: string
    constraints:
      not_null: true
    description: Salesforce Case ID

  - name: subject
    type: string
    constraints:
      not_null: true
    description: Case subject

  - name: status
    type: string
    constraints:
      not_null: true
    description: Case status

  - name: priority
    type: string
    description: Case priority

  - name: origin
    type: string
    description: Case origin (phone, email, web, etc.)

  - name: account_id
    type: string
    description: Associated Account ID

  - name: contact_id
    type: string
    description: Associated Contact ID

  - name: description
    type: string
    description: Case description

  - name: created_date
    type: timestamp
    constraints:
      not_null: true
    description: Creation date in Salesforce

  - name: closed_date
    type: timestamp
    description: Case closed date

metadata:
  description: Source schema for Salesforce Case objects
  owner: sales-ops-team
  layer: raw
  source: salesforce_crm
  tags:
    - raw
    - source-schema
    - salesforce
    - crm
