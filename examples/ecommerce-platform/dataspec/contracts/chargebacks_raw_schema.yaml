# Contract: Chargebacks Raw Schema
# Defines the expected schema from payment chargebacks API

name: chargebacks_raw_schema
version: '1.0.0'
fields:
  - name: chargeback_id
    type: string
    constraints:
      not_null: true
    description: Chargeback identifier

  - name: transaction_id
    type: string
    constraints:
      not_null: true
    description: Original transaction ID

  - name: amount
    type: decimal
    constraints:
      not_null: true
    description: Chargeback amount

  - name: currency
    type: string
    constraints:
      not_null: true
    description: Chargeback currency

  - name: reason_code
    type: string
    description: Reason code for chargeback

  - name: status
    type: string
    constraints:
      not_null: true
    description: Chargeback status

  - name: created_at
    type: timestamp
    constraints:
      not_null: true
    description: Chargeback creation timestamp

  - name: resolved_at
    type: timestamp
    description: Resolution timestamp

metadata:
  description: Source schema for chargebacks from payment API
  owner: payments-team
  layer: raw
  source: payment_api
  tags:
    - raw
    - source-schema
    - payments
