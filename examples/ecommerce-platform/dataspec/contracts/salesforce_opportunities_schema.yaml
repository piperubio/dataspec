# Contract: Salesforce Opportunities Schema
# Defines the expected schema from Salesforce Opportunity objects

name: salesforce_opportunities_schema
version: '1.0.0'
fields:
  - name: opportunity_id
    type: string
    constraints:
      not_null: true
    description: Salesforce Opportunity ID

  - name: account_id
    type: string
    constraints:
      not_null: true
    description: Associated Account ID

  - name: name
    type: string
    constraints:
      not_null: true
    description: Opportunity name

  - name: stage
    type: string
    constraints:
      not_null: true
    description: Sales stage

  - name: amount
    type: decimal
    description: Opportunity amount

  - name: currency
    type: string
    description: Currency code

  - name: close_date
    type: date
    description: Expected close date

  - name: probability
    type: decimal
    description: Win probability

  - name: created_date
    type: timestamp
    constraints:
      not_null: true
    description: Creation date in Salesforce

  - name: last_modified_date
    type: timestamp
    description: Last modification date

metadata:
  description: Source schema for Salesforce Opportunity objects
  owner: sales-ops-team
  layer: raw
  source: salesforce_crm
  tags:
    - raw
    - source-schema
    - salesforce
    - crm
